<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14100d">
<title>Check-in</title>
<style>
  :root {
    --bar: #14100d; --accent: #f57c00; --bg: #f6f4f1; --card: #fff; --txt: #1d1a17; --mut: #7a716a;
    --ok: #1f8a4c; --ok-bg: #e5f4ea; --bad: #c0392b; --line: #e7e2dc; --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  header { background: var(--bar); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; }
  header .sub { color: #c9bfb6; font-size: 13px; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 12px calc(96px + env(safe-area-inset-bottom)); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--card); border-radius: var(--r); padding: 10px 12px; border: 1px solid var(--line); }
  .kpi .v { font-size: 24px; font-weight: 700; }
  .kpi .l { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; }
  .kpi.ok .v { color: var(--ok); }
  .search { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 4; background: var(--bg); padding: 4px 0 8px; }
  .search input { width: 100%; font-size: 18px; padding: 14px 16px; border-radius: var(--r);
    border: 2px solid var(--line); background: #fff; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button { flex: 1; padding: 9px 4px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
    font-size: 14px; color: var(--txt); }
  .tabs button.on { background: var(--bar); color: #fff; border-color: var(--bar); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px;
    display: flex; align-items: center; gap: 12px; }
  .row.done { background: var(--ok-bg); border-color: #bfe3cb; }
  .row .info { flex: 1; min-width: 0; }
  .row .nm { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
  .row .meta { color: var(--mut); font-size: 13px; overflow-wrap: anywhere; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #efe9e3; color: #5d544d; margin-right: 4px; }
  .tag.man { background: #fff1de; color: #9a5a00; }
  .tag.qtd { background: #e8eefc; color: #2a4aa0; }
  .tag.warn { background: #fde8e6; color: var(--bad); }
  .btn { border: 0; border-radius: 12px; padding: 14px 18px; font-size: 16px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .btn.go { background: var(--accent); color: #fff; min-width: 108px; }
  .btn.ghost { background: transparent; color: var(--mut); padding: 8px 10px; font-weight: 500; font-size: 13px; text-decoration: underline; }
  .btn.dark { background: var(--bar); color: #fff; }
  .btn:disabled { opacity: .5; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .okmark { color: var(--ok); font-weight: 700; font-size: 15px; }
  .empty { text-align: center; color: var(--mut); padding: 28px 8px; }
  .fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 16px 20px; font-size: 16px;
    font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
  .foot { color: var(--mut); font-size: 12px; text-align: center; margin-top: 16px; }
  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .center input { font-size: 28px; letter-spacing: .3em; text-align: center; width: 220px; padding: 12px; border-radius: var(--r);
    border: 2px solid var(--line); margin: 12px 0; }
  .err { color: var(--bad); min-height: 20px; }
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(520px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 18px; }
  .dlg h2 { margin: 0 0 12px; font-size: 18px; }
  .dlg label { display: block; font-size: 13px; color: var(--mut); margin: 10px 0 4px; }
  .dlg input, .dlg textarea { width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); font-family: inherit; }
  .dlg textarea { min-height: 160px; }
  .dlg .act { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .dlg .chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--txt); font-size: 15px; }
  .dlg .chk input { width: auto; }
  .seg { display: flex; gap: 6px; margin-bottom: 4px; }
  .seg button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 14px; }
  .seg button.on { background: var(--bar); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--bar); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 9;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
  .toast button { color: #ffb366; background: none; border: 0; font-weight: 700; margin-left: 8px; pointer-events: auto; }
</style>
</head>
<body>
<header><h1 id="tit">Check-in</h1><div class="sub" id="sub">carregando…</div></header>
<main id="app"><div class="center">Carregando…</div></main>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
