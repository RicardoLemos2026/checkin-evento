<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f4f1; --card:#ffffff; --ink:#1d1814; --muted:#6f655c; --line:#e6e0d9;
  --navy:#1d1814; --accent:#f57c00; --accent-ink:#ffffff; --bar:#14100d;
  --free:#e0a526; --pago:#2f7d5b; --ok:#1f8a4c; --warn:#a96a07; --bad:#c0392b;
  --band:#f4ece3; --tot:#fde3c4; --sub:#f3f0ec; --input:#fff7d6;
  --okbg:rgba(31,138,76,.13); --warnbg:rgba(224,165,38,.2); --badbg:rgba(192,57,43,.13);
  --shadow:0 1px 2px rgba(30,20,10,.06),0 4px 14px rgba(30,20,10,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100d0b; --card:#1b1713; --ink:#efe9e2; --muted:#a39990; --line:#322b25;
    --navy:#ffb067; --accent:#ff9a2e; --accent-ink:#1a1006; --bar:#0b0907;
    --free:#f0b93a; --pago:#4fb88a; --ok:#4ac584; --warn:#f0b93a; --bad:#ff7a6b;
    --band:#2a2119; --tot:#3b2b1a; --sub:#231e19; --input:#2c2a14;
    --okbg:rgba(74,197,132,.16); --warnbg:rgba(240,185,58,.18); --badbg:rgba(255,122,107,.16);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#100d0b; --card:#1b1713; --ink:#efe9e2; --muted:#a39990; --line:#322b25;
  --navy:#ffb067; --accent:#ff9a2e; --accent-ink:#1a1006; --bar:#0b0907;
  --free:#f0b93a; --pago:#4fb88a; --ok:#4ac584; --warn:#f0b93a; --bad:#ff7a6b;
  --band:#2a2119; --tot:#3b2b1a; --sub:#231e19; --input:#2c2a14;
  --okbg:rgba(74,197,132,.16); --warnbg:rgba(240,185,58,.18); --badbg:rgba(255,122,107,.16);
  --shadow:none;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 52px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

.track{position:relative;height:16px;border-radius:999px;background:var(--sub);border:1px solid var(--line);overflow:hidden;display:flex}
.seg{display:block;height:100%}.seg.free{background:var(--free)}.seg.pago{background:var(--pago)}.seg.rec{background:var(--accent)}
.mark{position:absolute;top:22px;height:24px;width:0;border-left:2px dashed var(--muted);opacity:.85}

.mark.hit{border-left-color:var(--ok)}.mark.hit span b{color:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}

.btn.danger{background:var(--badbg);color:var(--bad)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}

input.in,select.in{background:var(--input)}
input.num{width:100px;text-align:right}
.search{flex:1;min-width:160px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer}
.pill.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:grid;place-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.dlg{background:var(--card);border-radius:18px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;border:1px solid var(--line)}
.dlg h3{margin:0 0 12px;color:var(--navy);font-size:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.fld.wide{grid-column:1/-1}.fld input,.fld select,.fld textarea{width:100%;font-weight:400;font-size:14px}
.fld small{font-weight:400;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:14px;align-items:center}.acts .sp{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.note{font-size:12.5px;color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.res .c{background:var(--sub);border-radius:12px;padding:10px;text-align:center}
.res .c .h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.res .c .n{font-size:17px;font-weight:800;margin-top:2px}.res .c .n.neg{color:var(--bad)}.res .c .n.pos{color:var(--ok)}
.res .c .m{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35}
@media(max-width:560px){.res{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid{grid-template-columns:1fr}.kpi .v{font-size:22px}}
.ck{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.ck.in{background:var(--okbg);border-color:transparent}
.ck .nm{flex:1;min-width:0}.ck .nm b{display:block;overflow-wrap:anywhere;font-size:15px}
.ck .nm span{font-size:12.5px;color:var(--muted)}
.ck .btn{min-width:112px;padding:12px 16px;font-size:15px}
.kpis.ck3{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.ck3>.card:first-child{grid-column:1/-1}
.ckbar{height:14px;border-radius:999px;background:var(--sub);border:1px solid var(--line);overflow:hidden;display:flex;margin-top:8px}
.searchbig{width:100%;font-size:17px;padding:13px 14px;margin-bottom:10px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cfgrow{display:grid;grid-template-columns:minmax(120px,1.6fr) repeat(5,minmax(70px,1fr)) auto;gap:6px;align-items:center;margin-bottom:6px}
.cfgrow.h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cfgrow input,.cfgrow select{width:100%;padding:6px 8px}

</style>

<div class="hbar"><div class="hin"><a class="brand" href="#home"><span class="logo">$</span><span>Financeiro de Eventos</span></a><div class="chips" id="chips"></div></div></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const moneyK = n => { n = Number(n) || 0; return Math.abs(n) >= 1000 ? "$ " + (n / 1000).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "k" : money(n); };
const money = n => { n = Number(n) || 0; return (n < 0 ? "-" : "") + "$ " + nf2.format(Math.abs(n)); };
const pct = n => (n == null || !isFinite(n)) ? "—" : (n * 100).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const int = n => (Number(n) || 0).toLocaleString("pt-BR");
const fdate = iso => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "";
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const ftime = iso => { if (!iso) return ""; const d = new Date(iso); const t = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " + t; };
const stripeFee = v => v > 0 ? r2(v * 0.029 + 0.30) : 0;
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };

/* ================= importação Stripe (funções puras) ================= */
function normName(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\(.*?\)/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
function sameName(a, b) {
  a = normName(a); b = normName(b);
  if (!a || !b) return false;
  if (a === b || a.startsWith(b) || b.startsWith(a)) return true;
  const ta = a.split(" "), tb = b.split(" ");
  return ta[0] === tb[0] && ta[ta.length - 1] === tb[tb.length - 1];
}
function stripeBrands(raw) {
  const cnt = {};
  raw.forEach(r => {
    if (!/^(charge|payment)$/i.test(String(r["Type"] || "").trim()) || num(r["Amount"]) <= 0) return;
    const b = String(r["brand (metadata)"] || "").trim();
    cnt[b] = (cnt[b] || 0) + 1;
  });
  return Object.keys(cnt).map(k => ({ brand: k, n: cnt[k] })).sort((a, b) => b.n - a.n);
}
function stripeCandidates(raw, opt, existing) {
  const g = (r, k) => String(r[k] == null ? "" : r[k]).trim();
  const charges = raw.filter(r => /^(charge|payment)$/i.test(g(r, "Type")) && num(r["Amount"]) > 0);
  const refBySrc = {};
  raw.filter(r => /^(refund|payment_refund)$/i.test(g(r, "Type"))).forEach(r => {
    const s = g(r, "Source"); if (s) refBySrc[s] = (refBySrc[s] || 0) + Math.abs(num(r["Amount"]));
  });
  const out = [];
  charges.forEach(r => {
    if (opt.brand != null && g(r, "brand (metadata)") !== opt.brand) return;
    const created = g(r, "Created (UTC)").slice(0, 10);
    if (opt.minDate && created < opt.minDate) return;
    const avail = g(r, "Available On (UTC)").slice(0, 10);
    const amount = num(r["Amount"]), fee = num(r["Fee"]);
    const qty = Math.max(1, parseInt(g(r, "quantidade (metadata)"), 10) || 1);
    const email = g(r, "lead_email (metadata)") || g(r, "customer_email (metadata)") || g(r, "Customer Email");
    const name = g(r, "customer_name (metadata)") || g(r, "Customer Name") || email || "(sem nome)";
    const src = g(r, "Source") || g(r, "id");
    const refunded = (refBySrc[g(r, "Source")] || 0) >= amount - 0.005;
    let restV = amount, restF = fee;
    for (let i = 1; i <= qty; i++) {
      const v = i === qty ? r2(restV) : r2(amount / qty), f = i === qty ? r2(restF) : r2(fee / qty);
      restV -= v; restF -= f;
      const it = {
        key: src + "#" + i, stripeId: qty > 1 ? src + "#" + i : src,
        cliente: qty > 1 ? name + " (" + i + "/" + qty + ")" : name, email,
        dataProc: created, dataReceb: avail, valor: v, taxa: f, refunded, status: "novo", match: null
      };
      // já existe no app?
      const bySid = existing.find(e => e.stripeId && e.stripeId === it.stripeId);
      const byHeur = bySid || existing.find(e => !e.stripeId && e.dataProc === created && sameName(e.cliente, name) &&
        (Math.abs((+e.valor || 0) - v) < 0.005 || (e.sub === "Reembolso" && (+e.valor || 0) === 0)));
      const ex = bySid || byHeur;
      if (ex) {
        it.match = ex.id;
        if (refunded) it.status = ex.sub === "Reembolso" ? "dup" : "conv";
        else it.status = "dup";
      } else it.status = refunded ? "novo_reemb" : "novo";
      out.push(it);
    }
  });
  return out.sort((a, b) => a.dataProc < b.dataProc ? 1 : a.dataProc > b.dataProc ? -1 : 0);
}

/* ================= cálculos ================= */
function calc() {
  const cfg = cfgNow(), segs = cfg.segmentos || [];
  const ing = S.ins.filter(r => r.sub === "Ingresso");
  const bySeg = segs.map(s => ({ ...s, metas: [0, 1, 2].map(i => +((s.metas || [])[i]) || 0), real: ing.filter(r => r.origem === s.nome).length }));
  const grp = tipo => {
    const L = bySeg.filter(s => s.tipo === tipo);
    return { rows: L, real: sum(L, s => s.real), metas: [0, 1, 2].map(i => sum(L, s => s.metas[i])) };
  };
  const free = grp("free"), pago = grp("pago");
  const tot = { real: free.real + pago.real, metas: [0, 1, 2].map(i => free.metas[i] + pago.metas[i]) };
  const semOrigem = ing.filter(r => !segs.some(s => s.nome === r.origem)).length;
  const recReal = sum(ing, r => r.valor), feeReal = sum(S.ins, r => r.taxa);
  const recMeta = [0, 1, 2].map(i => sum(bySeg, s => (+s.ticket || 0) * s.metas[i]));
  const taxa = +cfg.taxaPrevista || 0;
  const feeMeta = recMeta.map(v => v * taxa);
  const cats = (cfg.categorias || []).map(c => ({ ...c, budget: +c.budget || 0, real: sum(S.gastos.filter(g => g.categoria === c.nome), g => g.valor) }));
  const gastoReal = sum(S.gastos, g => g.valor), budgetTot = sum(cats, c => c.budget);
  const gastoSemCat = gastoReal - sum(cats, c => c.real);
  const linhas = getLinhas();
  const alBruta = sum(linhas, l => (+l.qtd || 0) * (+l.preco || 0)), alTaxa = sum(linhas, l => l.taxa), alQtd = sum(linhas, l => l.qtd);
  const alDesp = sum(S.adesp, d => d.valor);
  return {
    cfg, segs: bySeg, free, pago, tot, semOrigem, recReal, feeReal, recMeta, feeMeta, taxa,
    liqReal: recReal - feeReal, liqMeta: recMeta.map((v, i) => v - feeMeta[i]),
    cats, gastoReal, budgetTot, gastoSemCat,
    resReal: recReal - gastoReal, resMeta: recMeta.map(v => v - budgetTot),
    al: { linhas, bruta: alBruta, taxa: alTaxa, qtd: alQtd, liq: alBruta - alTaxa, desp: alDesp, saldo: alBruta - alTaxa - alDesp }
  };
}
function getLinhas() {
  if (S.aDraft) return S.aDraft;
  return (S.arec && S.arec.linhas && S.arec.linhas.length) ? S.arec.linhas : FORMAS_DEF;
}

    metaBar({ label: "Inscritos pagos", fmt: int, parts: [{ v: c.pago.real, cls: "pago", t: "Pagos" }], marks: METAS.map((m, i) => ({ v: c.pago.metas[i], t: m })) });

  const sumRow = (lbl, g) => '<tr class="sub"><td>' + lbl + '</td><td></td><td class="c">' + int(g.real) + "</td>" + g.metas.map(m => '<td class="c">' + int(m) + "</td>").join("") + "</tr>";
  const pr = (lbl, base, kind) => '<tr><td>' + lbl + "</td><td></td><td></td>" + [0, 1, 2].map(i => {
    const meta = base.metas[i];
    if (kind === "pct") { const p = meta ? base.real / meta : null; return '<td class="c ' + (p != null && p >= 1 ? "ok" : "") + '">' + pct(p) + "</td>"; }
    return '<td class="c">' + int(Math.max(meta - base.real, 0)) + "</td>";
  }).join("") + "</tr>";
  const tbl = '<div class="scroll"><table class="tbl">' + hdr +
    '<tr class="band"><td colspan="6">FREE (sem cobrança)</td></tr>' + c.free.rows.map(segRow).join("") + sumRow("Total Free", c.free) +
    '<tr class="band"><td colspan="6">PAGOS</td></tr>' + c.pago.rows.map(segRow).join("") + sumRow("Total Pagos", c.pago) +
    '<tr class="tot"><td>TOTAL INSCRITOS</td><td></td><td class="c">' + int(c.tot.real) + "</td>" + c.tot.metas.map(m => '<td class="c">' + int(m) + "</td>").join("") + "</tr>" +
    pr("% da meta atingida (total)", c.tot, "pct") + pr("Faltam para a meta (total)", c.tot, "gap") +
    pr("% da meta de pagos atingida", c.pago, "pct") + pr("Faltam pagos para a meta", c.pago, "gap") + "</table></div>";
  const insCard = '<div class="card"><h2>Inscritos · Free × Pagos<small>' + int(c.tot.real) + " no total</small></h2>" + bars + legend + '<div style="height:10px"></div>' + tbl + "</div>";

  // receita
  const rrow = (lbl, real, metas, f, cls) => '<tr class="' + (cls || "") + '"><td>' + lbl + '</td><td class="r">' + f(real) + "</td>" + metas.map(m => '<td class="r">' + f(m) + "</td>").join("") + "</tr>";
  const tm = (rec, n) => n ? rec / n : null;
  const tmF = v => v == null ? "—" : money(v);
  const pRec = c.recMeta.map(m => m ? c.recReal / m : null);
  const recTbl = '<div class="scroll"><table class="tbl"><tr><th></th><th>Real</th>' + METAS.map(m => "<th>" + m + "</th>").join("") + "</tr>" +
    rrow("Receita total", c.recReal, c.recMeta, money) +
    rrow("Fee Stripe (" + pct(c.taxa) + " previsto)", c.feeReal, c.feeMeta, money) +
    rrow("Receita líquida", c.liqReal, c.liqMeta, money, "tot") +
    rrow("Ticket médio (receita ÷ inscritos)", tm(c.recReal, c.tot.real), c.recMeta.map((m, i) => tm(m, c.tot.metas[i])), tmF) +
    rrow("Ticket médio dos pagos", tm(c.recReal, c.pago.real), c.recMeta.map((m, i) => tm(m, c.pago.metas[i])), tmF) +
    '<tr><td>% da meta de receita</td><td></td>' + pRec.map(p => '<td class="r ' + (p != null && p >= 1 ? "ok" : "") + '">' + pct(p) + "</td>").join("") + "</tr>" +
    '<tr><td>Faltam para a meta</td><td></td>' + c.recMeta.map(m => '<td class="r">' + money(Math.max(m - c.recReal, 0)) + "</td>").join("") + "</tr></table></div>";
  const recBar = metaBar({ label: "Receita de ingressos", fmt: money, fmtMark: moneyK, parts: [{ v: c.recReal, cls: "rec", t: "Receita" }], marks: METAS.map((m, i) => ({ v: c.recMeta[i], t: m })) });
  const recCard = '<div class="card"><h2>Receita · real × metas</h2>' + recBar + '<div style="height:6px"></div>' + recTbl + "</div>";

  // gastos
  const gRows = c.cats.map(k => {
    const p = k.budget ? k.real / k.budget : null, cl = p == null ? "" : p > 1 ? "bad" : p > 0.9 ? "warn" : "";
    return "<tr><td>" + esc(k.nome) + '</td><td class="r">' + money(k.real) + '</td><td class="r">' + (k.budget ? money(k.budget) : "—") + '</td><td style="min-width:110px">' +
      (p == null ? "" : '<div class="bar"><i class="' + cl + '" style="width:' + Math.min(100, p * 100) + '%"></i></div>') + '</td><td class="c ' + (cl === "bad" ? "bad" : "") + '">' + pct(p) + '</td><td class="r ' + (k.budget && k.real > k.budget ? "bad" : "") + '">' + (k.budget ? money(k.budget - k.real) : "—") + "</td></tr>";
  }).join("");
  const gTbl = '<div class="scroll"><table class="tbl"><tr><th>Categoria</th><th>Real</th><th>Budget</th><th></th><th>% usado</th><th>Saldo</th></tr>' +
    (gRows || '<tr><td colspan="6" class="empty">Cadastre as categorias em Metas e Budget.</td></tr>') +
    '<tr class="tot"><td>TOTAL</td><td class="r">' + money(c.gastoReal) + '</td><td class="r">' + money(c.budgetTot) + '</td><td></td><td class="c">' + pct(c.budgetTot ? c.gastoReal / c.budgetTot : null) + '</td><td class="r">' + money(c.budgetTot - c.gastoReal) + "</td></tr></table></div>";
  const gCard = '<div class="card"><h2>Gastos × Budget<small>vermelho = estourou · amarelo = acima de 90%</small></h2>' + gTbl + "</div>";

  // resultado
  const rc = (h, n, m) => '<div class="c"><div class="h">' + h + '</div><div class="n ' + sc(n) + '">' + money(n) + '</div><div class="m">' + m + "</div></div>";
  const resCard = '<div class="card"><h2>Resultado do evento<small>meta = receita da meta − budget total</small></h2><div class="res">' +
    rc("Real hoje", c.resReal, "Receita " + money(c.recReal) + "<br>Gasto " + money(c.gastoReal)) +
    METAS.map((m, i) => rc("Meta " + m, c.resMeta[i], "Receita " + money(c.recMeta[i]) + "<br>Budget " + money(c.budgetTot))).join("") + "</div></div>";

  // alertas
  const al = [];
  if (Math.abs(c.gastoSemCat) > 0.005) al.push("Há " + money(c.gastoSemCat) + " em gastos sem categoria válida (aba Gastos).");
  if (c.semOrigem) al.push(c.semOrigem + " ingresso(s) sem origem válida (aba Inscritos).");
  const odd = S.ins.filter(r => r.sub !== "Ingresso" && r.sub !== "Reembolso").length;
  if (odd) al.push(odd + " lançamento(s) com subcategoria que não é Ingresso nem Reembolso e por isso não entram nas contas.");
  const alCard = al.length ? '<div class="banner warn">' + al.map(esc).join("<br>") + "</div>" : "";

  const lun = '<div class="card"><h2>Almoço (terceirizado)<small>separado das metas e do resultado</small></h2><div class="note">Saldo do almoço: <b style="color:var(--' + (c.al.saldo < 0 ? "bad" : "ink") + ')">' + money(c.al.saldo) + "</b> · receita líquida " + money(c.al.liq) + " · despesas " + money(c.al.desp) + ' · <a href="#' + S.eid + '--almoco">abrir aba Almoço</a></div></div>';

  return alCard + kp + resCard + '<div class="two"><div>' + insCard + '</div><div>' + recCard + "</div></div>" + gCard + lun;
}

    (list || '<div class="card empty">' + (all.length ? "Ninguém encontrado nesse filtro." : "Nenhum inscrito ainda.") + "</div>") +

/* ---- Inscritos ---- */
function segTipo(nome) { const s = (cfgNow().segmentos || []).find(x => x.nome === nome); return s ? s.tipo : null; }
function insFiltrados() {
  const cfg = cfgNow(), f = S.fIns;
  let rows = S.ins.slice().sort((a, b) => (b.dataProc || "").localeCompare(a.dataProc || "") || (b.seq || 0) - (a.seq || 0));
  if (f.seg) rows = rows.filter(r => (f.seg === "_sem" ? !(cfg.segmentos || []).some(s => s.nome === r.origem) : r.origem === f.seg));
  if (f.q) { const q = normName(f.q); rows = rows.filter(r => normName(r.cliente).includes(q)); }
  return rows;
}
async function exportInscritos() {
  if (!window.XLSX) { toast("Não foi possível carregar o gerador de Excel.", true); return; }
  const dl = await window.claude.use("downloads");
  if (!dl) { toast("Download indisponível nesta visualização.", true); return; }
  const rows = insFiltrados(), cfg = cfgNow(), f = S.fIns;
  const aoa = [["Data", "Cliente", "E-mail", "Origem", "Tipo de origem", "Valor", "Taxa", "Líquido", "Tipo", "Conta", "Data recebimento", "Check-in", "ID Stripe"],
    ...rows.map(r => { const tp = segTipo(r.origem); return [fdate(r.dataProc), r.cliente || "", r.email || "", r.origem || "", tp === "free" ? "Free" : tp ? "Pago" : "sem origem",
      +r.valor || 0, +r.taxa || 0, (+r.valor || 0) - (+r.taxa || 0), r.sub || "", r.conta || "", fdate(r.dataReceb), r.checkinEm ? ftime(r.checkinEm) : "", r.stripeId || ""]; })];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [12, 40, 30, 16, 14, 10, 10, 10, 12, 10, 16, 14, 30].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Inscritos");
  const limpa = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "");
  const filtro = (f.seg ? "_" + limpa(f.seg === "_sem" ? "sem_origem" : f.seg) : "") + (f.q ? "_busca" : "");
  try { await dl.save({ filename: "Inscritos_" + limpa(cfg.nome || "evento") + filtro + ".xlsx", data: XLSX.write(wb, { type: "array", bookType: "xlsx" }) }); toast(rows.length + " inscrito(s) exportado(s)"); }
  catch (e) { if (!e || e.code !== "declined") toast("Não foi possível gerar o arquivo.", true); }
}

function insForm(rec, o2) {
  o2 = o2 || {};
  const cfg = cfgNow(), segs = cfg.segmentos || [], isNew = !rec;
  const v0 = rec || { cliente: "", origem: (segs.find(s => s.tipo === "pago") || segs[0] || {}).nome || "", sub: "Ingresso", conta: "Stripe", dataProc: todayISO(), dataReceb: "", valor: "", taxa: "" };

  const contas = Array.from(new Set(["Stripe", "Zelle", "Cash"].concat(S.ins.map(r => r.conta).filter(Boolean))));

      { key: "origem", label: "Origem", type: "select", options: segs.map(s => opt(s.nome, s.nome + " (" + (s.tipo === "free" ? "Free" : "Pago") + ")")).concat(segs.some(s => s.nome === v0.origem) || !v0.origem ? [] : [opt(v0.origem, v0.origem + " (sem origem válida)")]) },
      { key: "sub", label: "Tipo de lançamento", type: "select", options: [opt("Ingresso"), opt("Reembolso")].concat(["Ingresso", "Reembolso"].includes(v0.sub) ? [] : [opt(v0.sub)]) },
      { key: "valor", label: "Valor total ($)", type: "number", step: "0.01" },
      { key: "taxa", label: "Taxa ($)", type: "number", step: "0.01", hint: "Stripe: 2,9% + $ 0,30 (sugestão)" },
      { key: "conta", label: "Conta", list: "dlConta" },
      { key: "dataProc", label: "Data de processamento", type: "date" },
      { key: "dataReceb", label: "Data de recebimento", type: "date" }
    ],
    datalists: '<datalist id="dlConta">' + contas.map(c => '<option value="' + esc(c) + '">').join("") + "</datalist>",
    validate: v => !v.cliente.trim() ? "Informe o nome do cliente." : null,
    onSave: v => run(async () => {
      const data = { cliente: v.cliente.trim(), origem: v.origem, sub: v.sub, valor: r2(num(v.valor)), taxa: r2(num(v.taxa)), conta: v.conta.trim(), dataProc: v.dataProc || "", dataReceb: v.dataReceb || "" };
      if (isNew) { data.seq = Date.now(); data.criadoEm = new Date().toISOString(); if (o2.checkin) data.checkinEm = new Date().toISOString(); await S.db.collection(P("inscritos")).add(data); }
      else await S.db.doc(P("inscritos/" + rec.id)).set({ ...clean(rec), ...data });
    }, "Salvo"),
    onDelete: isNew ? null : () => run(() => S.db.doc(P("inscritos/" + rec.id)).delete(), "Excluído"),
    onReady: q => {
      const org = q("#f_origem"), val = q("#f_valor"), tax = q("#f_taxa"), conta = q("#f_conta"), sub = q("#f_sub");
      const auto = () => {
        if (!taxaDirty) tax.value = (conta.value.trim().toLowerCase() === "stripe") ? stripeFee(num(val.value)) : 0;
      };
      org.onchange = () => { if (!valorDirty) { const s = segs.find(x => x.nome === org.value); val.value = s ? (+s.ticket || 0) : 0; } auto(); };
      sub.onchange = () => { if (sub.value === "Reembolso" && !valorDirty) { val.value = 0; } };
      val.oninput = () => { valorDirty = true; auto(); };
      tax.oninput = () => { taxaDirty = true; };
      conta.oninput = auto;
    }
  });
}

/* ---- Gastos ---- */
function viewGastos() {
  const cfg = cfgNow(), f = S.fGas;
  let rows = S.gastos.slice().sort((a, b) => (b.dataPag || "").localeCompare(a.dataPag || "") || (b.seq || 0) - (a.seq || 0));
  if (f.cat) rows = rows.filter(r => r.categoria === f.cat);
  if (f.st) rows = rows.filter(r => r.status === f.st);
  if (f.q) { const q = normName(f.q); rows = rows.filter(r => normName(r.fornecedor + " " + (r.obs || "")).includes(q)); }

function impRecompute(keepSel) {
  const im = S.imp; if (!im) return;
  im.cands = stripeCandidates(im.raw, { brand: im.brand, minDate: im.minDate }, S.ins);
  const old = im.sel; im.sel = {};
  im.cands.forEach(c => { im.sel[c.key] = keepSel && c.key in old ? old[c.key] : (c.status === "novo" || c.status === "novo_reemb" || c.status === "conv"); });
}
function impLoad(file) {
  if (!window.Papa) { toast("Não foi possível carregar o leitor de CSV.", true); return; }
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: res => {
      const raw = res.data || [];
      if (!raw.length || !("Type" in raw[0]) || !("Amount" in raw[0])) { toast("Esse arquivo não parece o extrato do Stripe (faltam colunas Type e Amount).", true); return; }
      const brands = stripeBrands(raw);
      const firstSale = raw.filter(r => /^(charge|payment)$/i.test(String(r["Type"]).trim())).map(r => String(r["Created (UTC)"]).slice(0, 10)).sort()[0] || "";
      S.imp = { fileName: file.name, raw, brands, brand: brands.length ? brands[0].brand : "", minDate: firstSale, orig: ((cfgNow().segmentos || []).find(s => s.tipo === "pago") || {}).nome || "", orMap: {}, cands: [], sel: {} };
      impRecompute(false); render(true);
    },
    error: () => toast("Não foi possível ler o arquivo.", true)
  });
}
async function impApply() {
  const im = S.imp, list = im.cands.filter(c => im.sel[c.key]);
  let n = 0;
  const ok = await run(async () => {
    for (const c of list) {
      const origem = im.orMap[c.key] || im.orig;
      if (c.status === "conv") { const ex = S.ins.find(e => e.id === c.match); if (ex) { await S.db.doc(P("inscritos/" + ex.id)).set({ ...clean(ex), sub: "Reembolso", valor: 0, stripeId: ex.stripeId || c.stripeId }); n++; } }
      else if (c.status === "novo" || c.status === "novo_reemb") {
        const rf = c.status === "novo_reemb";
        await S.db.collection(P("inscritos")).add({ cliente: c.cliente, origem, sub: rf ? "Reembolso" : "Ingresso", valor: rf ? 0 : c.valor, taxa: c.taxa, conta: "Stripe", dataProc: c.dataProc, dataReceb: c.dataReceb, stripeId: c.stripeId, seq: Date.now() + n, criadoEm: new Date().toISOString() });
        n++;
      }
    }
  });
  if (ok) { toast(n + " lançamento(s) importado(s)"); S.imp.cands = []; setTimeout(() => { impRecompute(false); render(true); }, 600); }
  else if (n) toast("Importação parou após " + n + " lançamentos. Rode de novo: o que já entrou não duplica.", true);
}

  add("Resumo", res, [34, 8, 10, 14, 14, 14, 14]);
  const ins = S.ins.slice().sort((a, b) => (a.dataProc || "").localeCompare(b.dataProc || ""));
  add("Receita", [["Cliente", "Data de Processamento", "Data recebimento", "ValorTotal", "Taxa", "Valor Liquido Realizado", "Categoria", "Subcategoria", "Conta", "Origem", "Check-in"],
    ...ins.map(r => [r.cliente, fdate(r.dataProc), fdate(r.dataReceb), +r.valor || 0, +r.taxa || 0, (+r.valor || 0) - (+r.taxa || 0), "Evento", r.sub, r.conta, r.origem, r.checkinEm ? ftime(r.checkinEm) : ""])], [38, 20, 16, 12, 10, 22, 10, 14, 10, 14, 14]);
  const gs = S.gastos.slice().sort((a, b) => (a.dataPag || "").localeCompare(b.dataPag || ""));
  add("Controle de Gastos", [["Fornecedor", "Categoria", "Valor Real", "Data Pagamento", "Forma de Pagamento", "Status Pagamento", "Observações"], ...gs.map(g => [g.fornecedor, g.categoria, +g.valor || 0, fdate(g.dataPag), g.forma, g.status, g.obs])], [28, 34, 12, 16, 22, 16, 30]);
  const al = [["Forma de pagamento", "Qtd vendida", "Preço unitário", "Receita bruta", "Taxa (Stripe)", "Receita líquida"], ...c.al.linhas.map(l => [l.forma, +l.qtd || 0, +l.preco || 0, (+l.qtd || 0) * (+l.preco || 0), +l.taxa || 0, (+l.qtd || 0) * (+l.preco || 0) - (+l.taxa || 0)]),
    ["TOTAL", c.al.qtd, "", c.al.bruta, c.al.taxa, c.al.liq], [], ["Descrição", "Fornecedor", "Valor", "Status", "Data Pagamento", "Observações"], ...S.adesp.map(d => [d.descricao, d.fornecedor, +d.valor || 0, d.status, fdate(d.dataPag), d.obs]),
    ["TOTAL DESPESAS", "", c.al.desp], [], ["Saldo do almoço", c.al.saldo]];
  add("Almoço", al, [28, 20, 14, 14, 16, 30]);
  const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  const nome = (c.cfg.nome || "evento").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "_");
  try { await dl.save({ filename: "Financeiro_" + nome + ".xlsx", data: buf }); toast("Arquivo gerado"); }
  catch (e) { if (!e || e.code !== "declined") toast("Não foi possível gerar o arquivo.", true); }
}

/* ================= eventos ================= */
function bindView() {
  const v = $("#view");
  const on = (sel, fn) => v.querySelectorAll(sel).forEach(fn);
  const q = $("#qIns"); if (q) q.oninput = () => { S.fIns.q = q.value; rerenderKeepFocus("#qIns"); };
  on("[data-seg]", b => b.onclick = () => { S.fIns.seg = b.dataset.seg; render(true); });
  const ne = $("#newEvent"); if (ne) ne.onclick = () => eventForm(null);
  on("[data-open]", c => c.onclick = () => { location.hash = c.dataset.open + "--painel"; });
  on("[data-ev-edit]", b => b.onclick = e => { e.stopPropagation(); eventForm(S.events.find(x => x.id === b.dataset.evEdit)); });
  on("[data-ev-arc]", b => b.onclick = e => { e.stopPropagation(); const ev = S.events.find(x => x.id === b.dataset.evArc); if (ev) run(() => S.db.doc("eventos/" + ev.id).update({ arquivado: !ev.arquivado }), ev.arquivado ? "Evento restaurado" : "Evento arquivado"); });
  on("[data-ev-del]", b => b.onclick = e => { e.stopPropagation(); deleteEventForm(S.events.find(x => x.id === b.dataset.evDel)); });
  const ta = $("#togArch"); if (ta) ta.onclick = () => { S.showArch = !S.showArch; ensureSubs(); render(true); };
  const ni = $("#newIns"); if (ni) ni.onclick = () => insForm(null);
  const ei = $("#expIns"); if (ei) ei.onclick = exportInscritos;
  const qc = $("#qChk"); if (qc) qc.oninput = () => { S.fChk.q = qc.value; rerenderKeepFocus("#qChk"); };
  on("[data-ckf]", b => b.onclick = () => { S.fChk.f = b.dataset.ckf; render(true); });
  const wi = $("#walkIn"); if (wi) wi.onclick = () => insForm(null, { checkin: true });
  on("[data-ck]", b => b.onclick = () => { const r = S.ins.find(x => x.id === b.dataset.ck); if (r) run(() => S.db.doc(P("inscritos/" + r.id)).update({ checkinEm: new Date().toISOString() }), "Check-in: " + r.cliente); });
  on("[data-unck]", b => b.onclick = () => { const r = S.ins.find(x => x.id === b.dataset.unck); if (r) run(() => S.db.doc(P("inscritos/" + r.id)).update({ checkinEm: "" }), "Check-in desfeito: " + r.cliente); });
  on("[data-edit-ins]", r => r.onclick = () => insForm(S.ins.find(x => x.id === r.dataset.editIns)));
  const qg = $("#qGas"); if (qg) qg.oninput = () => { S.fGas.q = qg.value; rerenderKeepFocus("#qGas"); };
  const fc = $("#fCat"); if (fc) fc.onchange = () => { S.fGas.cat = fc.value; render(true); };
  const fs = $("#fSt"); if (fs) fs.onchange = () => { S.fGas.st = fs.value; render(true); };
  const ng = $("#newGas"); if (ng) ng.onclick = () => gasForm(null);
  on("[data-edit-gas]", r => r.onclick = () => gasForm(S.gastos.find(x => x.id === r.dataset.editGas)));
  // almoço
  on("[data-al]", i => i.oninput = () => {
    if (!S.aDraft) S.aDraft = JSON.parse(JSON.stringify(getLinhas()));
    S.aDraft[+i.dataset.i][i.dataset.al] = num(i.value); updAlTotals();
  });
  const sa = $("#saveAl"); if (sa) sa.onclick = async () => {
    const L = getLinhas().map(l => ({ forma: l.forma, qtd: +l.qtd || 0, preco: +l.preco || 0, taxa: +l.taxa || 0 }));
    if (await run(() => S.db.doc(P("almoco/receita")).set({ linhas: L }), "Receita do almoço salva")) S.aDraft = null;
  };
  const na = $("#newAdesp"); if (na) na.onclick = () => adespForm(null);
  on("[data-edit-adesp]", r => r.onclick = () => adespForm(S.adesp.find(x => x.id === r.dataset.editAdesp)));
  // importar
  const cf = $("#csvFile"); if (cf) cf.onchange = () => { if (cf.files[0]) impLoad(cf.files[0]); };
  const ib = $("#impBrand"); if (ib) ib.onchange = () => { S.imp.brand = ib.value; impRecompute(false); render(true); };
  const im = $("#impMin"); if (im) im.onchange = () => { S.imp.minDate = im.value; impRecompute(false); render(true); };
  const io = $("#impOrig"); if (io) io.onchange = () => { S.imp.orig = io.value; render(true); };
  on("[data-imp-sel]", c => c.onchange = () => { S.imp.sel[c.dataset.impSel] = c.checked; render(true); });
  on("[data-imp-or]", s => s.onchange = () => { S.imp.orMap[s.dataset.impOr] = s.value; });
  const ig = $("#impGo"); if (ig) ig.onclick = impApply;
  // config
  on("[data-c]", el => el.oninput = el.onchange = () => {
    const d = cfgDraft(), k = el.dataset.c, i = +el.dataset.i;
    if (k === "nome" || k === "data" || k === "local") d[k] = el.value;
    else if (k === "taxa") d.taxaPrevista = num(el.value) / 100;
    else if (k === "snome") d.segmentos[i].nome = el.value;
    else if (k === "stipo") d.segmentos[i].tipo = el.value;
    else if (k === "sticket") d.segmentos[i].ticket = num(el.value);
    else if (k === "smeta") { d.segmentos[i].metas = d.segmentos[i].metas || [0, 0, 0]; d.segmentos[i].metas[+el.dataset.k] = num(el.value); }
    else if (k === "cnome") d.categorias[i].nome = el.value;
    else if (k === "cbud") d.categorias[i].budget = num(el.value);
  });
  const as = $("#addSeg"); if (as) as.onclick = () => { cfgDraft().segmentos.push({ nome: "Nova origem", tipo: "pago", ticket: 0, metas: [0, 0, 0] }); render(true); };
  const ac = $("#addCat"); if (ac) ac.onclick = () => { cfgDraft().categorias.push({ nome: "Nova categoria", budget: 0 }); render(true); };
  on("[data-c-del-seg]", b => b.onclick = async () => {
    const d = cfgDraft(), s = d.segmentos[+b.dataset.cDelSeg];
    if (S.ins.some(r => r.origem === s.nome)) { toast("Há inscritos com essa origem. Mude a origem deles antes de remover.", true); return; }
    d.segmentos.splice(+b.dataset.cDelSeg, 1); render(true);
  });
  on("[data-c-del-cat]", b => b.onclick = async () => {
    const d = cfgDraft(), k = d.categorias[+b.dataset.cDelCat];
    if (S.gastos.some(g => g.categoria === k.nome)) { toast("Há gastos nessa categoria. Mude a categoria deles antes de remover.", true); return; }
    d.categorias.splice(+b.dataset.cDelCat, 1); render(true);
  });
  const sc = $("#saveCfg"); if (sc) sc.onclick = async () => {
    const d = cfgDraft(), names = d.segmentos.map(s => s.nome.trim()), cn = d.categorias.map(k => k.nome.trim());
    if (names.some(n => !n) || new Set(names).size !== names.length) { toast("As origens precisam de nomes únicos.", true); return; }
    if (cn.some(n => !n) || new Set(cn).size !== cn.length) { toast("As categorias precisam de nomes únicos.", true); return; }
    const out = { nome: d.nome.trim() || "Evento", data: d.data || "", local: d.local || "", taxaPrevista: +d.taxaPrevista || 0,
      segmentos: d.segmentos.map(s => ({ nome: s.nome.trim(), tipo: s.tipo, ticket: +s.ticket || 0, metas: [0, 1, 2].map(k => +((s.metas || [])[k]) || 0) })),
      categorias: d.categorias.map(k => ({ nome: k.nome.trim(), budget: +k.budget || 0 })) };
    if (await run(() => S.db.doc("eventos/" + S.eid).update(out), "Configurações salvas")) S.cDraft = null;
  };
  const dc = $("#discCfg"); if (dc) dc.onclick = () => { S.cDraft = null; render(true); };
  const ex = $("#expXlsx"); if (ex) ex.onclick = exportXlsx;
}
function rerenderKeepFocus(sel) {
  const el = $(sel), pos = el ? el.selectionStart : 0;
  S.pending = false; const keep = S.tab; render(true);
  const n = $(sel); if (n && S.tab === keep) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b && S.eid) { location.hash = S.eid + "--" + b.dataset.tab; } });
$("#view").addEventListener("focusout", () => { if (S.pending) setTimeout(() => { if (!editingNow()) schedule(); }, 50); });
function syncCurrent() {
  const ev = S.events.find(e => e.id === S.eid) || null, d = S.evData[S.eid] || {};
  S.cfg = ev; S.ins = d.ins || []; S.gastos = d.gastos || []; S.adesp = d.adesp || []; S.arec = d.arec || null;
}
function route() {
  const h = (location.hash || "").replace("#", ""), prev = S.eid;
  if (!h || h === "home") { S.view = "home"; S.eid = null; }
  else { const m = h.match(/^(.+?)--([a-z]+)$/); S.view = "event"; S.eid = m ? m[1] : h; S.tab = m && TABS.some(t => t[0] === m[2]) ? m[2] : "painel"; }
  if (S.eid !== prev) { S.cDraft = null; S.aDraft = null; S.imp = null; S.fIns = { q: "", seg: "" }; S.fChk = { q: "", f: "faltam" }; S.fGas = { q: "", cat: "", st: "" }; }
  syncCurrent(); ensureSubs(); schedule(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ================= conexão com os dados ================= */
const evd = id => S.evData[id] || (S.evData[id] = { ins: [], gastos: [], adesp: [], arec: null });
const listOf = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
function failSub(e) { S.err = e; if (e && e.code === "revoked") S.db = null; S.sync = "ok"; schedule(); }
function sub(key, fn) { if (!S.subs[key]) S.subs[key] = fn(); }
function subCol(id, kind, coll) {
  sub(id + ":" + kind, () => S.db.collection("eventos/" + id + "/" + coll).onSnapshot(s => { evd(id)[kind] = listOf(s); S.got.add(id + ":" + kind); if (id === S.eid) syncCurrent(); schedule(); }, failSub));
}
function ensureSubs() {
  if (!S.db) return;
  S.events.forEach(ev => {
    if (ev.arquivado && !S.showArch && ev.id !== S.eid) return;
    subCol(ev.id, "ins", "inscritos"); subCol(ev.id, "gastos", "gastos");
  });
  if (S.eid && S.events.some(e => e.id === S.eid)) {
    subCol(S.eid, "adesp", "almoco_despesas");
    sub(S.eid + ":arec", () => S.db.doc("eventos/" + S.eid + "/almoco/receita").onSnapshot(s => { evd(S.eid).arec = s.exists ? s.data() : null; S.got.add(S.eid + ":arec"); syncCurrent(); schedule(); }, failSub));
  }
  Object.keys(S.subs).forEach(k => { const [id, kind] = k.split(":"); if ((kind === "adesp" || kind === "arec") && id !== S.eid) { S.subs[k](); delete S.subs[k]; S.got.delete(k); } });
}
const lastTouch = {};
async function touch() {
  if (!S.db || !S.eid || Date.now() - (lastTouch[S.eid] || 0) < 20000) return;
  lastTouch[S.eid] = Date.now();
  try { await S.db.doc("eventos/" + S.eid).update({ ultimaAtividade: new Date().toISOString() }); } catch (e) { }
}
(async function init() {
  route();
  const slow = setTimeout(() => { if (S.sync === "load") { S.sync = "slow"; schedule(); } }, 10000);
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  try { S.user = await window.claude.use("user"); } catch (e) { S.user = null; }
  if (!db) { clearTimeout(slow); S.sync = "off"; schedule(); return; }
  S.db = db;
  try { if (S.user) { const cw = await S.user.can("data.write"); S.canWrite = cw !== false; } } catch (e) { }
  db.collection("eventos").onSnapshot(s => {
    S.events = listOf(s); S.got.add("events"); S.sync = "ok"; clearTimeout(slow);
    const ids = new Set(S.events.map(e => e.id));
    Object.keys(S.subs).forEach(k => { if (!ids.has(k.split(":")[0])) { S.subs[k](); delete S.subs[k]; S.got.delete(k); } });
    Object.keys(S.evData).forEach(id => { if (!ids.has(id)) delete S.evData[id]; });
    syncCurrent(); ensureSubs(); schedule();
  }, failSub);
})();
</script>
